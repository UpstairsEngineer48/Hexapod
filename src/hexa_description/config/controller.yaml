controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

hexapod_joint_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - Joint1_1
      - Joint1_2
      - Joint1_3
      - Joint2_1
      - Joint2_2
      - Joint2_3
      - Joint3_1
      - Joint3_2
      - Joint3_3
      - Joint4_1
      - Joint4_2
      - Joint4_3
      - Joint5_1
      - Joint5_2
      - Joint5_3
      - Joint6_1
      - Joint6_2
      - Joint6_3

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

    gains:
      Joint1_1 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint1_2 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint1_3 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint2_1 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint2_2 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint2_3 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint3_1 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint3_2 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint3_3 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}

      Joint4_1 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint4_2 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint4_3 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint5_1 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint5_2 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint5_3 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint6_1 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      Joint6_2 : {p: 180.0, i: 20.0, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
